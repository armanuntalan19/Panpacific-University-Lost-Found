<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Found Items - FindBack: Panpacific University Lost &amp; Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
<link rel="icon" type="image/png" href="images/logo.png" />
<link rel="stylesheet" href="css/navbar.css" />
<link rel="stylesheet" href="css/found-items.css" />
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="page-hero page-hero-compact" id="foundItemsHero">
  <div class="container hero-row">
    <div>
      <h1 class="page-hero-title"><i class="ti ti-box"></i> Found Items</h1>
      <p class="hero-subtitle">Browse by category. Photos, location, and other identifying details stay private until a claim is verified.</p>
    </div>
    <a href="javascript:void(0)" class="btn btn-accent" onclick="openReportModal('found')"><i class="ti ti-package"></i> Report a Found Item</a>
  </div>
</section>

<section class="page-content">
  <div class="container">

    <div class="card search-filter-bar">
      <div class="form-group search-field-wide">
        <label>Category</label>
        <div class="search-box">
          <i class="ti ti-category"></i>
          <select id="categoryFilter">
            <option value="">All categories</option>
          </select>
        </div>
      </div>
      <div class="search-actions">
        <label class="search-actions-label">&nbsp;</label>
        <button class="btn btn-outline" id="clearBtn"><i class="ti ti-x"></i> Clear</button>
      </div>
    </div>

    <div id="itemsGrid" class="grid-cards items-results-grid">
      <p class="loading-text">Loading found items…</p>
    </div>

  </div>
</section>

<footer class="footer">
  <strong>FindBack: Panpacific University</strong> - Campus Lost &amp; Found &middot; Built for students, by students
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/items.js"></script>
<script src="js/found-items.js"></script>
</body>
</html>
