<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - FindBack: Panpacific University Lost &amp; Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
<link rel="icon" type="image/png" href="images/logo.png" />
<link rel="stylesheet" href="css/reset-password.css" />
</head>
<body class="auth-body">

<div class="auth-wrapper">

  <div class="auth-photo-side">
    <img src="images/login-illustration.png" alt="Lost & Found - Match it back" />
  </div>

  <main class="auth-form-side">
    <div class="auth-brand">
      <img src="images/logo.png" alt="Panpacific University" />
      <div>
        <strong>Panpacific University</strong>
        <span>FindBack: Lost &amp; Found</span>
      </div>
    </div>

    <h1>Set a New Password</h1>
    <p class="sub">Choose a new password for your account.</p>

    <form id="resetPasswordForm">
      <div class="alert alert-error" id="resetPasswordAlert"></div>

      <div class="form-group">
        <label>New Password</label>
        <div class="input-wrap">
          <i class="ti ti-lock"></i>
          <input type="password" id="newPassword" minlength="8" required />
        </div>
        <p class="form-hint">At least 8 characters, with 1 uppercase letter, 1 number, and 1 special character.</p>
      </div>

      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="input-wrap">
          <i class="ti ti-lock"></i>
          <input type="password" id="confirmNewPassword" minlength="8" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="resetPasswordBtn">
        <i class="ti ti-device-floppy"></i> Update Password
      </button>
    </form>

    <p class="auth-switch">Remembered your password? <a href="index.html">Log in here</a></p>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
